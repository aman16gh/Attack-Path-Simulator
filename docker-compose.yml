version: "3.8"

services:
  db:
    image: postgres:15
    container_name: attack_sim_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: attack_sim
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: attack_sim_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/attack_sim
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: attack_sim_frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    # If you want to use port 3000 for frontend, change to "3000:80"

volumes:
  pgdata: