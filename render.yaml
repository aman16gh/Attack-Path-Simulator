databases:
  - name: db
    plan: free
    databaseName: attack_sim

services:
  # Backend API (FastAPI)
  - type: web
    name: backend
    runtime: docker
    repo: aman16gh/Attack-Path-Simulator
    branch: master
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

  # Frontend (React + Nginx)
  - type: web
    name: frontend
    runtime: docker
    repo: aman16gh/Attack-Path-Simulator
    branch: master
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: BACKEND_URL
        value: http://backend:8000